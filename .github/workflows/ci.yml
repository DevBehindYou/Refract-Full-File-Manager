name: CI

# Build and test run here, not on the developer machine (no Android SDK installed locally).
# Every push to main and every pull request runs static analysis, unit tests and APK
# packaging; the debug APK is uploaded as an artifact so it can be installed on a phone.
# The emulator job is manual only (Actions tab > CI > Run workflow).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (ktlint, detekt, Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint (debug and release), including custom checks
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/ktlint
            app/build/reports/detekt
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests and APK packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: Run unit tests and package APKs
        run: >
          ./gradlew
          :lint-rules:test
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            lint-rules/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: refract-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (emulator, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14

# Out of scope for now: the full emulator matrix (testing/DEVICE_MATRIX.md), screenshot
# tests and macrobenchmark (testing/TEST_STRATEGY.md §11).
