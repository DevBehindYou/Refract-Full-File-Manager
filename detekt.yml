build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120

complexity:
  LongMethod:
    # CODING_RULES.md: functions <= 60 lines. detekt's default counts the whole
    # function body; composables have a separate, larger convention (<= 100 lines)
    # that isn't distinguished by this rule alone without the community
    # detekt-compose ruleset — not added in Phase 1 (see PHASE_1_NOTES.md).
    threshold: 60
  LongParameterList:
    functionThreshold: 6
    constructorThreshold: 8

naming:
  active: true
