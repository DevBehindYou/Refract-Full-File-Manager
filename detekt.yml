build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 220
    excludeCommentStatements: true
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected)'

complexity:
  LongMethod:
    threshold: 500
  LongParameterList:
    functionThreshold: 15
    constructorThreshold: 15
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    active: false
  ComplexCondition:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    active: false

naming:
  active: true
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*)$'
    ignoreAnnotated: ['Composable']
